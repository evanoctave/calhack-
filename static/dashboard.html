<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightfall</title><link rel="stylesheet" href="/tokens.css"><script src="/app.js"></script><script src="/cam.js"></script>
<style>.camwrap { position: relative; width: 100%; max-width: 420px; }
#cam, #overlay { display: block; width: 100%; border-radius: var(--radius); }
#cam { border: 1px solid var(--border); background: #000; }
#overlay { position: absolute; inset: 0; pointer-events: none; }</style>
</head><body>
<header>
  <div><h1>Nightfall</h1><div class="muted small">Night-exit guardian. Mock mode, no keys.</div></div>
  <div class="row"><span id="clock" class="mono"></span><span id="night" class="pill"></span><button onclick="toggleTheme()">Theme</button><button onclick="reset()">Reset</button></div>
</header>
<div class="grid">
  <section class="card">
    <h2>Incident</h2>
    <div class="row" style="margin-bottom:8px"><span id="sdot" class="dot"></span><strong id="state">none</strong><span id="inc" class="mono muted"></span></div>
    <div id="detail" class="muted small">Press Simulate approach, or walk into the camera zone.</div>
    <div id="deadline" class="small muted"></div>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="ev('motion')">Simulate approach</button>
      <button onclick="ev('door_open')">Open door (o)</button>
      <button onclick="ev('door_close')">Close door (c)</button>
      <button onclick="ev('person_seen',{inside:true})">Person seen inside</button>
      <button onclick="reply()">Reply (typed)</button>
      <button onclick="ev('close')">Close incident</button>
    </div>
    <div class="row" style="margin-top:8px"><input id="replytext" placeholder="What Dad says" style="flex:1"></div>
  </section>
  <section class="card">
    <h2>Camera (laptop webcam)</h2>
    <div class="camwrap"><video id="cam" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
    <div class="row" style="margin-top:8px"><button onclick="startCam()">Enable camera</button><span id="camstat" class="muted small">off. A person entering the frame starts the conversation; leaving the red door zone and not coming back is the exit.</span></div>
  </section>
  <section class="card">
    <h2>Family tree</h2>
    <ul id="tree" class="list"></ul>
    <div class="row" style="margin-top:8px"><input id="judge" placeholder="Your name (judge)"><button class="primary" onclick="addJudge()">Add me at tier 1</button></div>
    <div id="judgeurl" class="small" style="margin-top:8px"></div>
  </section>
  <section class="card" style="grid-column: 1 / -1">
    <h2>Escalation log</h2>
    <ul id="log" class="log"></ul>
  </section>
</div>
<script>
let last = null;
function render(s) {
  document.getElementById("clock").textContent = fmtTime(s.now);
  const n = document.getElementById("night"); n.textContent = s.night_mode ? "night mode on" : "night mode off"; n.className = "pill " + (s.night_mode ? "ok" : "");
  const inc = s.incident; const st = inc ? inc.state : "ARMED_IDLE";
  document.getElementById("state").textContent = st; document.getElementById("inc").textContent = inc ? inc.id : "";
  document.getElementById("sdot").className = "dot " + ({ESCALATING:"danger",EXHAUSTED:"danger",DOOR_OPEN:"warn",CONVERSATION:"accent",ACKED:"ok",RETURNED:"ok"}[st] || "");
  document.getElementById("deadline").textContent = inc && inc.deadline_at ? "Call 911 at " + fmtTime(inc.deadline_at) + " if not found (15-minute rule)." : "";
  const tree = document.getElementById("tree"); tree.innerHTML = s.household.tree.map(m => `<li>Tier ${m.tier}: ${esc(m.name)} <a class="small" href="/phone.html#${esc(m.id)}" target="_blank">phone page</a></li>`).join("");
  const log = document.getElementById("log"); log.innerHTML = s.log.slice().reverse().map(line).join("");
}
function line(e) {
  let body = "";
  if (e.type === "state") body = `<span class="pill">${esc(e.rule)}</span> ${esc(e.from)} to <strong>${esc(e.to)}</strong> on ${esc(e.kind)}. ${esc(e.detail)}`;
  else if (e.type === "speak") body = `<span class="pill ok">voice</span> "${esc(e.text)}"`;
  else if (e.type === "ring") body = `<span class="pill danger">ring tier ${esc(e.tier)}</span> ${esc((e.members||[]).join(", "))}`;
  else if (e.type === "brief_ready") body = `<span class="pill">brief</span> built for ${esc(e.incident_id)}`;
  else if (e.type === "tree") body = `<span class="pill">tree</span> added ${esc(e.member.name)} at tier ${esc(e.member.tier)}`;
  else body = `<span class="pill">${esc(e.type)}</span>`;
  return `<li><span class="mono muted">${esc(fmtTime(e.ts))}</span><span>${body}</span></li>`;
}
async function refresh() { last = await (await fetch("/state")).json(); render(last); }
async function ev(kind, payload) { await post("/event", {kind, payload: payload || {}}); refresh(); }
async function reply() { const t = document.getElementById("replytext").value.trim(); if (t) await ev("reply", {text: t}); }
async function reset() { await post("/reset"); refresh(); }
async function addJudge() {
  const name = document.getElementById("judge").value.trim(); if (!name) return;
  const r = await post("/tree", {name, phone: "web", tier: 1});
  document.getElementById("judgeurl").innerHTML = `Open on your phone: <a href="${esc(r.phone_url)}" target="_blank">${esc(r.phone_url)}</a>`;
  refresh();
}
sse("/sse/dashboard", async e => {
  if (e.type === "speak") speak(e.text);
  if (e.type === "exit_frames_request") postFrames(e.incident_id);
  refresh();
});
document.addEventListener("keydown", e => { if (e.target.tagName === "INPUT") return; if (e.key === "o") ev("door_open"); if (e.key === "c") ev("door_close"); if (e.key === "m") ev("motion"); });
refresh(); setInterval(refresh, 5000);
</script></body></html>
