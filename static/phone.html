<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightfall phone</title><link rel="stylesheet" href="/tokens.css"><script src="/app.js"></script>
<style>body { max-width: 480px; } .ringing { border-color: var(--danger); } </style>
</head><body>
<header><div><h1>Nightfall</h1><div id="who" class="muted small">caregiver phone</div></div><button onclick="toggleTheme()">Theme</button></header>
<section id="card" class="card">
  <div class="row" style="margin-bottom:8px"><span id="dot" class="dot ok"></span><strong id="status">Waiting. Nothing to do tonight.</strong></div>
  <p id="msg" class="muted"></p>
  <button id="sound" class="big" onclick="enableSound()">Enable sound</button>
  <div id="actions" hidden>
    <button class="big danger" onclick="ack()">I've got him</button>
    <div style="height:8px"></div>
    <a id="brief" class="big" href="#" target="_blank"><button class="big primary">Open brief</button></a>
  </div>
  <div id="deadline" class="banner" hidden>15 minutes since exit. Call 911 now.</div>
</section>
<section id="agent" class="card" hidden style="margin-top:16px">
  <h2>Nightfall agent (the call, in the browser)</h2>
  <p id="agentsay" class="muted"></p>
  <div class="row"><button class="primary" onclick="listen()" id="listenbtn">Hold to ask (tap, then speak)</button><input id="agenttext" placeholder="or type: where should I look?" style="flex:1"><button onclick="askTyped()">Ask</button></div>
  <p id="heard" class="small muted"></p>
</section>
<script>
const member = location.hash.slice(1) || "TM-SARAH"; document.getElementById("who").textContent = "caregiver phone: " + member;
let ctxA = null, osc = null, incident = null, soundOn = false;
function enableSound() { ctxA = new (window.AudioContext || window.webkitAudioContext)(); soundOn = true; document.getElementById("sound").hidden = true; speak("Sound enabled."); }
function ringTone(on) {
  if (!ctxA) return;
  if (on && !osc) { osc = ctxA.createOscillator(); const g = ctxA.createGain(); g.gain.value = 0.15; osc.frequency.value = 880; osc.connect(g); g.connect(ctxA.destination); osc.start(); let hi = true; osc._iv = setInterval(() => { hi = !hi; osc.frequency.value = hi ? 880 : 660; }, 400); }
  if (!on && osc) { clearInterval(osc._iv); osc.stop(); osc = null; }
}
function set(status, dot, msg) { document.getElementById("status").textContent = status; document.getElementById("dot").className = "dot " + dot; document.getElementById("msg").textContent = msg || ""; }
sse("/sse/phone/" + member, e => {
  if (e.type === "ring") {
    incident = e.incident_id; document.getElementById("card").classList.add("ringing");
    set("Ringing: tier " + e.tier, "danger", e.message);
    document.getElementById("actions").hidden = false; document.getElementById("brief").href = e.link;
    ringTone(true); if (navigator.vibrate) navigator.vibrate([300, 200, 300]); speak(e.message);
    document.getElementById("agent").hidden = false; setTimeout(openingLine, 2500);
  }
  if (e.type === "acked") { ringTone(false); document.getElementById("card").classList.remove("ringing"); set("Acknowledged by " + e.by, "ok", "No further rings."); }
  if (e.type === "deadline") document.getElementById("deadline").hidden = false;
});
function playRef(audio, text) { if (audio && audio.url) { new Audio(audio.url).play().catch(() => speak(text)); } else speak(text); }
async function openingLine() {
  const r = await (await fetch("/agent/opening/" + incident + "/" + member)).json();
  document.getElementById("agentsay").textContent = r.say; ringTone(false); playRef(r.audio, r.say);
}
async function sendTurn(text) {
  document.getElementById("heard").textContent = 'You: "' + text + '"';
  const r = await post("/agent/turn", {incident_id: incident, member_id: member, text});
  document.getElementById("agentsay").textContent = r.say; playRef(r.audio, r.say);
  if (r.ack) { ringTone(false); set("You acknowledged by voice", "ok", "Other phones stop ringing."); }
}
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { document.getElementById("heard").textContent = "Speech recognition not available here; type instead."; return; }
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  document.getElementById("listenbtn").textContent = "Listening...";
  rec.onresult = ev => sendTurn(ev.results[0][0].transcript);
  rec.onend = () => { document.getElementById("listenbtn").textContent = "Hold to ask (tap, then speak)"; };
  rec.onerror = () => { document.getElementById("heard").textContent = "Did not catch that."; };
  rec.start();
}
async function askTyped() { const t = document.getElementById("agenttext").value.trim(); if (t) { document.getElementById("agenttext").value = ""; sendTurn(t); } }
async function ack() { if (!incident) return; const r = await post("/ack", {incident_id: incident, member_id: member}); ringTone(false); set("You acknowledged", "ok", r.first ? "Other phones stop ringing." : "Already acknowledged by " + r.acked_by); }
</script></body></html>
