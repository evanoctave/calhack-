<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightfall brief</title><script>
// Existing SMS links keep working. Use the React brief when its build is installed.
// Add ?legacy=1 to open the original brief while troubleshooting.
if (!new URLSearchParams(location.search).has('legacy')) {
  fetch('/ui/index.html', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
    if (r.ok) location.replace('/ui/index.html#/brief/' + encodeURIComponent(location.hash.slice(1)));
  }).catch(function () { /* The original brief below remains available. */ });
}
</script><link rel="stylesheet" href="/tokens.css"><script src="/app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head><body>
<header><div><h1 id="title">Missing-person brief</h1><div id="sub" class="muted small"></div></div><div class="row"><span id="timer" class="pill danger"></span><button onclick="toggleTheme()">Theme</button></div></header>
<div id="err" class="banner" hidden></div>
<div class="grid" id="main" hidden>
  <section class="card"><h2>Photo and exit frames</h2><div class="frames"><img id="photo" class="photo" alt="photo"><span id="frames"></span></div>
    <p id="prose"></p><p><strong>Wearing:</strong> <span id="clothing"></span> <span id="conf" class="muted small"></span></p></section>
  <section class="card" style="grid-column: 1 / -1"><h2>Read this to the dispatcher</h2><p id="police"></p></section>
  <section class="card"><h2>Medications</h2><ul id="meds" class="list"></ul><h2 style="margin-top:12px">Contacts</h2><ul id="contacts" class="list"></ul></section>
  <section class="card" style="grid-column: 1 / -1"><h2>Search map, <span id="radius"></span> mile radius <span id="src" class="pill"></span></h2><div id="map"></div></section>
  <section class="card"><h2>Check first (hazards)</h2><ul id="hazards" class="list"></ul></section>
  <section class="card"><h2>Call first (open now)</h2><ul id="call" class="list"></ul></section>
  <section class="card"><h2>Familiar places</h2><ul id="familiar" class="list"></ul><h2 style="margin-top:12px">Habits <span id="memsrc" class="pill"></span></h2><ul id="habits" class="list"></ul></section>
</div>
<script>
const token = location.hash.slice(1);
function li(p, extra) { return `<li>${esc(p.name)} <span class="muted small">${p.distance_mi != null ? p.distance_mi + " mi" : ""}</span> ${extra || ""}</li>`; }
function tel(p) { return p.phone ? `<a href="tel:${esc(p.phone.replace(/[^\d+]/g, ""))}">${esc(p.phone)}</a>` : ""; }
async function load() {
  const r = await fetch("/brief/" + token);
  if (!r.ok) { const e = document.getElementById("err"); e.hidden = false; e.textContent = r.status === 410 ? "This link expired." : "This link is not valid."; return; }
  const b = await r.json(); document.getElementById("main").hidden = false;
  document.getElementById("title").textContent = b.person_name + " left home at " + fmtTime(b.last_seen_at);
  document.getElementById("sub").textContent = "Shared with " + b.viewer + ". Link expires in 24 hours.";
  document.getElementById("photo").src = b.photo;
  document.getElementById("frames").innerHTML = (b.exit_frames || []).map(f => `<img src="${esc(f)}" alt="exit frame">`).join("");
  document.getElementById("prose").textContent = b.prose; document.getElementById("police").textContent = b.police_report || ""; document.getElementById("clothing").textContent = b.clothing_line;
  document.getElementById("conf").textContent = b.clothing_line === "see photo" ? "" : "(model confidence " + Math.round(b.clothing.confidence * 100) + "%, verify against the frame)";
  document.getElementById("meds").innerHTML = b.medications.length ? b.medications.map(m => `<li>${esc(m.name)} ${esc(m.dose)} ${esc(m.note)}</li>`).join("") : "<li class='muted'>not shared</li>";
  document.getElementById("contacts").innerHTML = b.contacts.map(c => `<li>${esc(c.name)} ${tel(c)} ${esc(c.note || "")}</li>`).join("");
  document.getElementById("radius").textContent = b.home.radius_mi; document.getElementById("src").textContent = "src=" + b.places_source;
  document.getElementById("hazards").innerHTML = b.hazards.map(p => li(p)).join("") || "<li class='muted'>none in radius</li>";
  document.getElementById("call").innerHTML = b.call_first.map(p => li(p, (p.open_now === true ? '<span class="pill ok">open</span>' : p.open_now === false ? '<span class="pill">closed</span>' : "") + " " + tel(p))).join("");
  document.getElementById("familiar").innerHTML = b.familiar.map(p => li(p)).join("");
  document.getElementById("habits").innerHTML = (b.habits || []).map(h => `<li>${esc(h.text)}</li>`).join("") || "<li class='muted'>none</li>";
  document.getElementById("memsrc").textContent = "src=" + (b.memory_source || "mock");
  const dl = new Date(b.deadline_at); setInterval(() => { const s = Math.round((dl - Date.now()) / 1000); document.getElementById("timer").textContent = s > 0 ? "Call 911 in " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : "Call 911 now"; }, 1000);
  if (window.L) {
    const map = L.map("map").setView([b.home.lat, b.home.lng], 14);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {attribution: "OpenStreetMap"}).addTo(map);
    L.circle([b.home.lat, b.home.lng], {radius: b.home.radius_mi * 1609.34, color: "#6b9cff", fillOpacity: 0.05}).addTo(map);
    L.circleMarker([b.home.lat, b.home.lng], {radius: 6, color: "#6b9cff"}).addTo(map).bindPopup("Home");
    const pin = (p, c) => L.circleMarker([p.lat, p.lng], {radius: 7, color: c, fillOpacity: 0.8}).addTo(map).bindPopup(esc(p.name));
    b.hazards.forEach(p => pin(p, "#ff6b6b")); b.call_first.forEach(p => pin(p, "#4cc17a")); b.familiar.forEach(p => pin(p, "#6b9cff"));
  }
}
load();
</script></body></html>
